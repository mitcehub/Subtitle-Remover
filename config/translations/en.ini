HardwareAccelerationDesc = Enable GPU (CUDA / DirectML / MPS) inference; disable to force CPU
HardwareAccelerationNO = No GPU accelerator available on this system
SttnMaxLoadNum = Frames Per Chunk
SttnMaxLoadNumDesc = Number of frames STTN processes at a time. Larger chunks provide more temporal context but use more VRAM. Default: 50 frames. Restart processing for the change to take effect
SttnNeighborStride = Local Window Radius
SttnNeighborStrideDesc = Number of frames considered on each side of the target frame (2×radius+1 frames per window). Larger radius adds context but requires more computation. Default: 5 frames. Restart processing to apply
SttnReferenceLength = Distant Reference Interval
SttnReferenceLengthDesc = Select one distant reference frame for every N frames in the current chunk. Smaller intervals add more references and use more VRAM. Default: 10 frames. Restart processing to apply
E2FGVIMaxFrames = Frames Per Chunk
E2FGVIMaxFramesDesc = Number of frames in each E2FGVI processing chunk. Larger chunks provide longer temporal context but use more VRAM. Default: 150 frames. Restart processing to apply
E2FGVINeighborStride = Local Window Radius
E2FGVINeighborStrideDesc = Number of frames considered on each side of the target frame (2×radius+1 frames per window). Larger radius adds context but requires more computation. Default: 5 frames. Restart processing to apply
E2FGVIReferenceLength = Distant Reference Interval
E2FGVIReferenceLengthDesc = Select one distant reference frame for every N frames in the current chunk. Smaller intervals add more references and use more VRAM. Default: 10 frames. Restart processing to apply
ProPainterChunkFrames = Frames Per Chunk
ProPainterChunkFramesDesc = Number of video frames in each chunk. The model still processes local windows; adjacent chunks overlap automatically. Default: 300 frames (~10 sec at 30 FPS). Larger chunks use more cache space and are more likely to span different scenes
ProPainterLocalFrames = Local Window Frames
ProPainterLocalFramesDesc = Number of consecutive video frames given to ProPainter for each inference window. Larger windows provide more local temporal context but require more computation and VRAM. Default: 10 frames
ProPainterReferenceFrames = References Per Window
ProPainterReferenceFramesDesc = Number of additional distant reference frames for each inference window, selected from the current chunk. More references add context but require more computation and VRAM. Default: 10 frames
ProPainterStride = Window Step
ProPainterStrideDesc = Number of frames to move between consecutive local windows. Smaller steps create more overlap and may improve consistency, but take longer. Default: 5 frames
CheckUpdateOnStartup = Check for updates when application starts
CheckUpdateOnStartupDesc = New versions will be more stable and have more features (recommended to enable this option)
