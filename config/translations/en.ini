SttnNeighborStride = Reference Frame Stride
SttnNeighborStrideDesc = Density of adjacent frames referenced per frame. Smaller means denser references, better effect but slower. Default 5 (lowest effect, fastest); can only be decreased to improve quality. Effective after re-running
SttnReferenceLength = Number of Reference Frames
SttnReferenceLengthDesc = Sampling span of distant reference frames. Smaller means more references, better effect but higher VRAM usage. Default 10 (lowest effect, least VRAM); can only be decreased to improve quality. Effective after re-running
SttnMaxLoadNum = Frames Per Pass
SttnMaxLoadNumDesc = Number of frames processed per pass. Larger gives broader context, better effect but higher VRAM usage. Default 50 (lowest effect, least VRAM); can only be increased to improve quality
E2FGVIMaxFrames = Frames Per Pass
E2FGVIMaxFramesDesc = E2FGVI chunk size. Larger gives broader reference context, better effect. Default 150 (lowest effect, fastest); can only be increased to improve quality
E2FGVINeighborStride = Reference Frame Stride
E2FGVINeighborStrideDesc = E2FGVI local window radius, 2×stride+1 frames per window. Smaller means denser references, steadier but slower. Default 5 (lowest effect, fastest); can only be decreased to improve quality
E2FGVIReferenceLength = Reference Frame Interval
E2FGVIReferenceLengthDesc = E2FGVI long-range reference sampling interval. Smaller means more references, better effect. Default 10 (lowest effect, fastest); can only be decreased to improve quality
ProPainterLocalFrames = Local Window Frames
ProPainterLocalFramesDesc = Number of consecutive local frames per ProPainter window. Larger gives broader temporal context, better effect. Default 10 (lowest effect, fastest); can only be increased to improve quality
ProPainterReferenceFrames = Reference Frame Count
ProPainterReferenceFramesDesc = Global reference frames per ProPainter window. Larger gives fuller references, better effect. Default 10 (lowest effect, fastest); can only be increased to improve quality
ProPainterStride = Window Stride
ProPainterStrideDesc = ProPainter local window stride. Smaller means more overlap, slower but steadier. Default 5 (lowest effect, fastest); can only be decreased to improve quality
CheckUpdateOnStartup = Check for updates when application starts
CheckUpdateOnStartupDesc = New versions will be more stable and have more features (recommended to enable this option)
