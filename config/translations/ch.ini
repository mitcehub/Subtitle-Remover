E2FGVISetting = E2FGVI 设置
ProPainterSetting = ProPainter 设置
SttnSetting = STTN设置
AboutSetting = 关于
HardwareAcceleration = GPU 加速
HardwareAccelerationDesc = 启用 GPU (CUDA / DirectML / MPS) 推理加速；关闭则强制使用 CPU
HardwareAccelerationNO = 当前环境无 GPU 加速可用
SttnMaxLoadNum = 每块处理帧数
SttnMaxLoadNumDesc = STTN 每次处理的帧数。调大可利用更长的前后文，但会增加显存占用。默认 50 帧；更改后重新开始处理生效
SttnNeighborStride = 局部窗口半径
SttnNeighborStrideDesc = 每次推理会参考目标帧前后各多少帧（每窗共 2×半径+1 帧）。调大参考范围更广，但会增加计算量。默认 5 帧；更改后重新开始处理生效
SttnReferenceLength = 远距参考间隔
SttnReferenceLengthDesc = 在当前处理块中每隔多少帧选一张远距参考帧。调小会选到更多参考帧、增加显存占用。默认间隔 10 帧；更改后重新开始处理生效
E2FGVIMaxFrames = 每块处理帧数
E2FGVIMaxFramesDesc = E2FGVI 每个处理块包含的帧数。调大可提供更长的时间上下文，但会增加显存占用。默认 150 帧；更改后重新开始处理生效
E2FGVINeighborStride = 局部窗口半径
E2FGVINeighborStrideDesc = 每次推理会参考目标帧前后各多少帧（每窗共 2×半径+1 帧）。调大参考范围更广，但会增加计算量。默认 5 帧；更改后重新开始处理生效
E2FGVIReferenceLength = 远距参考间隔
E2FGVIReferenceLengthDesc = 在当前处理块中每隔多少帧选一张远距参考帧。调小会选到更多参考帧、增加显存占用。默认间隔 10 帧；更改后重新开始处理生效
ProPainterChunkFrames = 每块处理帧数
ProPainterChunkFramesDesc = 每个视频块包含的帧数；模型仍按局部窗口逐段推理，块边界会自动重叠。默认 300 帧（约 10 秒@30fps）。调大缓存占用更高，也更可能跨到不同镜头
ProPainterLocalFrames = 局部窗口帧数
ProPainterLocalFramesDesc = 每次 ProPainter 推理输入的连续视频帧数。调大能看到更长的局部时间上下文，但会增加计算和显存占用。默认 10 帧
ProPainterReferenceFrames = 每窗参考帧数
ProPainterReferenceFramesDesc = 每次推理额外使用的远距参考帧数，候选来自当前处理块。调大参考更多，但会增加计算和显存占用。默认 10 帧
ProPainterStride = 窗口滑动步长
ProPainterStrideDesc = 相邻两次局部窗口推理之间移动多少帧。调小会增加窗口重叠，结果可能更平稳但处理更慢。默认 5 帧
CheckUpdateOnStartup = 在应用程序启动时检查更新
CheckUpdateOnStartupDesc = 新版本将更加稳定, 并拥有更多功能(建议启用此选项)
