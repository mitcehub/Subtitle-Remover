HardwareAcceleration = GPU 加速
HardwareAccelerationDesc = 启用 GPU (CUDA / DirectML / MPS) 推理加速；关闭则强制使用 CPU
HardwareAccelerationNO = 当前环境无 GPU 加速可用
SttnNeighborStride = 参考帧步长
SttnNeighborStrideDesc = 控制每帧参考的相邻帧密度。数值越小，参考越密集、效果越好但越慢。默认 5（效果最低、速度最快），只能向下调小以提升效果。修改后重新运行生效
SttnReferenceLength = 参考帧数量
SttnReferenceLengthDesc = 控制远距离参考帧的采样跨度。数值越小，参考越多、效果越好但显存占用越高。默认 10（效果最低、显存最省），只能向下调小以提升效果。修改后重新运行生效
SttnMaxLoadNum = 单次处理帧数
SttnMaxLoadNumDesc = 单次处理的帧数。数值越大，参考上下文越广、效果越好但显存占用越高。默认 50（效果最低、显存最省），只能向上调大以提升效果
E2FGVIMaxFrames = 单次处理帧数
E2FGVIMaxFramesDesc = E2FGVI 每个 chunk 的帧数。数值越大，参考上下文越广、效果越好。默认 150（效果最低、速度最快），只能向上调大以提升效果
E2FGVINeighborStride = 参考帧步长
E2FGVINeighborStrideDesc = E2FGVI local 滑窗半径，每窗 2×步长+1 帧。数值越小，参考越密集、越稳但越慢。默认 5（效果最低、速度最快），只能向下调小以提升效果
E2FGVIReferenceLength = 参考帧间隔
E2FGVIReferenceLengthDesc = E2FGVI 远距离参考帧采样间隔。数值越小，参考越多、效果越好。默认 10（效果最低、速度最快），只能向下调小以提升效果
ProPainterLocalFrames = 局部窗口帧数
ProPainterLocalFramesDesc = ProPainter 每个窗口的连续 local 帧数。数值越大，时间上下文越广、效果越好。默认 10（效果最低、速度最快），只能向上调大以提升效果
ProPainterReferenceFrames = 参考帧数量
ProPainterReferenceFramesDesc = ProPainter 每窗全局参考帧数量。数值越大，参考越充分、效果越好。默认 10（效果最低、速度最快），只能向上调大以提升效果
ProPainterStride = 窗口步长
ProPainterStrideDesc = ProPainter local 窗口滑动步长。数值越小，重叠越多、越慢但越稳。默认 5（效果最低、速度最快），只能向下调小以提升效果
CheckUpdateOnStartup = 在应用程序启动时检查更新
CheckUpdateOnStartupDesc = 新版本将更加稳定, 并拥有更多功能(建议启用此选项)
